name: Validate

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - run: pnpm validate

      # `relay/` is its own package with its own lockfile and node_modules (it
      # bundles separately for a non-VPC Lambda and shares no dependency tree
      # with the API). Root `pnpm validate` deliberately does not reach into
      # it, so CI runs the second half explicitly.
      - run: pnpm -C relay install --frozen-lockfile

      - run: pnpm -C relay validate
