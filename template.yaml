AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ReportFlow API - Lambda with API Gateway (HTTP API)

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: nodejs24.x

Resources:
  ReportFlowApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/reportflow-api-${Environment}"
      RetentionInDays: 7

  ReportFlowHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins: ["https://my.reportflow.app"]
        AllowHeaders:
          - Content-Type
          - Authorization
          - svix-id
          - svix-timestamp
          - svix-signature
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]

  ReportFlowApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ReportFlowApiLogGroup
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - api/handler.ts
        Minify: true
        Target: es2022
        Sourcemap: true
        External:
          - pg-native
          - better-sqlite3
          - tedious
          - sqlite3
          - mysql
          - mysql2
          - pg-query-stream
          - oracledb
    Properties:
      FunctionName: !Sub reportflow-api-${Environment}
      CodeUri: .
      Handler: api/handler.handler
      Tracing: PassThrough
      # Shared VPC with the mrhewbuc-rds RDS instance (same as davori, sabre, mizplace).
      VpcConfig:
        SecurityGroupIds:
          - sg-0d065bb06c8c04a68
        SubnetIds:
          - subnet-0cc43286651b1e2d9
          - subnet-03602b4d349546b6b
          - subnet-0ffadc50f6a7a1f26
      Environment:
        Variables:
          DB_HOST: !Sub "{{resolve:ssm:/reportflow/api/${Environment}/db-host}}"
          DB_NAME: !Sub "{{resolve:ssm:/reportflow/api/${Environment}/db-name}}"
          DB_USER: !Sub "{{resolve:ssm:/reportflow/api/${Environment}/db-user}}"
          DB_PASSWORD: !Sub "{{resolve:ssm:/reportflow/api/${Environment}/db-password}}"
          CLERK_JWT_KEY: !Sub "{{resolve:ssm:/reportflow/api/${Environment}/clerk-jwt-key}}"
          CLERK_WEBHOOK_SECRET: !Sub "{{resolve:ssm:/reportflow/api/${Environment}/clerk-webhook-secret}}"
          CLERK_SECRET_KEY: !Sub "{{resolve:ssm:/reportflow/api/${Environment}/clerk-secret-key}}"
          APP_URL: !Sub "{{resolve:ssm:/reportflow/api/${Environment}/app-url}}"
          ENVIRONMENT: !Ref Environment
          # Documents bucket (decisions §8, §12.5). One bucket, not per-env —
          # see api/lib/storage.ts's own default.
          DOCS_BUCKET: reportflow-docs-prod
      # Literal bucket ARN strings, NOT !Ref/!GetAtt: the bucket is not a
      # resource in this template (created out of band, per the onboarding
      # checklist), and aws_infrastructure.md:496 flags the same SAM
      # circular-dependency trap for a bucket ARN referenced from this
      # function's own role.
      #
      # SPLIT BY PREFIX rather than one grant on `/*`. The relay writes results
      # and the API reads them, and that direction is only real if the API
      # CANNOT write there — a blanket `/*` PutObject would let the API forge
      # the very answer it later trusts, and would also let it write a claim
      # and wedge a job the relay was about to take. Note there is deliberately
      # NO PutObject on `results/*` or `claims/*` anywhere below: the split is
      # held by ABSENCE of a grant, which nothing can be added later to
      # accidentally re-open, rather than by an explicit Deny that a future
      # broader Allow would have to be checked against.
      #
      # There is no `s3:HeadObject` IAM action — HeadObject is authorized by
      # s3:GetObject, which is what `headDocument` in api/lib/storage.ts
      # actually needs.
      Policies:
        - Statement:
            # Tenant documents. `org_*` is the whole document namespace: keys
            # are minted server-side as `{orgId}/{uuid}.pdf`
            # (api/lib/storage.ts) and orgId is always Clerk's `org_`-prefixed
            # org id (api/trpc/context.ts), so this covers every upload while
            # excluding the three relay prefixes by construction. PutObject is
            # required because a presigned POST is signed with THIS role's
            # credentials — S3 authorizes the browser's upload against it.
            - Sid: TenantDocumentsReadWrite
              Effect: Allow
              Action:
                - s3:PutObject
                - s3:GetObject
              Resource: "arn:aws:s3:::reportflow-docs-prod/org_*"
            # The API is the SOLE writer under jobs/ (decisions §12.11). Write
            # only: it never reads back a job it enqueued.
            - Sid: EnqueueRelayJob
              Effect: Allow
              Action: s3:PutObject
              Resource: "arn:aws:s3:::reportflow-docs-prod/jobs/*"
            # The poll backstop (§4.1) and local dev read results. Read only.
            - Sid: ReadRelayResult
              Effect: Allow
              Action: s3:GetObject
              Resource: "arn:aws:s3:::reportflow-docs-prod/results/*"
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReportFlowHttpApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiGatewayUrl:
    Description: API Gateway endpoint (use this as VITE_API_URL)
    Value: !Sub "https://${ReportFlowHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  FunctionArn:
    Value: !GetAtt ReportFlowApiFunction.Arn
