AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ReportFlow API - Lambda with API Gateway (HTTP API)

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, prod]

# Timeout covers the async import-processing invoke (parse + matcher chain
# over thousands of rows); HTTP requests still cut off at API Gateway's ~30s.
Globals:
  Function:
    Timeout: 300
    MemorySize: 1024
    Runtime: nodejs24.x

Resources:
  ReportFlowUploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "reportflow-uploads-${Environment}-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-raw-uploads
            Status: Enabled
            ExpirationInDays: 90

  ReportFlowApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/reportflow-api-${Environment}"
      RetentionInDays: 7

  ReportFlowHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins: ["https://my.reportflow.app"]
        AllowHeaders:
          - Content-Type
          - Authorization
          - svix-id
          - svix-timestamp
          - svix-signature
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]

  ReportFlowApiFunction:
    Type: AWS::Serverless::Function
    DependsOn: ReportFlowApiLogGroup
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - api/handler.ts
        Minify: true
        Target: es2022
        Sourcemap: true
        External:
          - pg-native
          - better-sqlite3
          - tedious
          - sqlite3
          - mysql
          - mysql2
          - pg-query-stream
          - oracledb
    Properties:
      FunctionName: !Sub reportflow-api-${Environment}
      CodeUri: .
      Handler: api/handler.handler
      Tracing: PassThrough
      # Shared VPC with the mrhewbuc-rds RDS instance (same as davori, sabre, mizplace).
      VpcConfig:
        SecurityGroupIds:
          - sg-0d065bb06c8c04a68
        SubnetIds:
          - subnet-0cc43286651b1e2d9
          - subnet-03602b4d349546b6b
          - subnet-0ffadc50f6a7a1f26
      Environment:
        Variables:
          DB_HOST: !Sub "{{resolve:ssm:/reportflow/api/${Environment}/db-host}}"
          DB_NAME: !Sub "{{resolve:ssm:/reportflow/api/${Environment}/db-name}}"
          DB_USER: !Sub "{{resolve:ssm:/reportflow/api/${Environment}/db-user}}"
          DB_PASSWORD: !Sub "{{resolve:ssm:/reportflow/api/${Environment}/db-password}}"
          CLERK_JWT_KEY: !Sub "{{resolve:ssm:/reportflow/api/${Environment}/clerk-jwt-key}}"
          CLERK_WEBHOOK_SECRET: !Sub "{{resolve:ssm:/reportflow/api/${Environment}/clerk-webhook-secret}}"
          CLERK_SECRET_KEY: !Sub "{{resolve:ssm:/reportflow/api/${Environment}/clerk-secret-key}}"
          APP_URL: !Sub "{{resolve:ssm:/reportflow/api/${Environment}/app-url}}"
          ENVIRONMENT: !Ref Environment
          # Fixed name (not !Ref) — referencing the bucket resource from the
          # function that also receives its notifications is a circular dep.
          UPLOADS_BUCKET: !Sub "reportflow-uploads-${Environment}-${AWS::AccountId}"
      Policies:
        - S3CrudPolicy:
            BucketName: !Sub "reportflow-uploads-${Environment}-${AWS::AccountId}"
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref ReportFlowHttpApi
            Path: /{proxy+}
            Method: ANY
        # S3 invokes the function from outside the VPC, so processing needs
        # no NAT/Lambda endpoint — the VPC's only AWS route is the S3 gateway.
        UploadCreated:
          Type: S3
          Properties:
            Bucket: !Ref ReportFlowUploadsBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

Outputs:
  ApiGatewayUrl:
    Description: API Gateway endpoint (use this as VITE_API_URL)
    Value: !Sub "https://${ReportFlowHttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
  FunctionArn:
    Value: !GetAtt ReportFlowApiFunction.Arn
